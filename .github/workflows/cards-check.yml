# Read-only pull_request check. Never pull_request_target.
# The validator script is checked out from the base SHA. Pull-request file
# bytes are read with the GitHub API and parsed as data. Nothing from the
# head commit is executed. This job has no write permission and posts no comments.
name: cards-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  cards-check:
    name: cards-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check 'pyyaml==6.0.2' 'jsonschema==4.23.0'

      - name: Validate card pull request from the base script
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: python3 .github/scripts/cards_check.py
