name: Request card removal
description: Ask to delist a project card from neox-ai.com
title: "Delist: owner/repo"
labels:
  - repo-removal
body:
  - type: markdown
    attributes:
      value: |
        Use this form if you want a project card removed from [neox-ai.com](https://neox-ai.com/repos/).
        Prefer opening it from the GitHub account that owns the repository.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: GitHub owner/repo to delist
      placeholder: owner/repo
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should this card be removed?
    validations:
      required: true
